    <style>
        body { background: var(--ink); }

        .connect-page-section {
            background: var(--ink); padding: 80px 0 72px;
            text-align: center; position: relative; overflow: hidden;
            min-height: calc(100vh - var(--nav-height));
            display: flex; align-items: center; justify-content: center;
        }
        .connect-page-section::before {
            content: 'CONNECT';
            position: absolute; font-family: 'Oswald', sans-serif;
            font-size: clamp(4em, 12vw, 9em); font-weight: 700;
            color: rgba(255,255,255,.016);
            top: 50%; left: 50%; transform: translate(-50%,-50%);
            white-space: nowrap; pointer-events: none; letter-spacing: .1em;
        }

        .connect-page-section h2 { color: #fff; margin-bottom: 8px; }
        .connect-sub {
            display: block; font-family: 'Oswald', sans-serif;
            font-size: .68em; font-weight: 300; letter-spacing: .34em;
            color: var(--ink-light); text-transform: uppercase;
            margin-bottom: 56px; direction: ltr;
        }

        /* ── SOCIALS ── */
        .socials {
            display: flex; justify-content: center; align-items: flex-start;
            gap: 40px; position: relative; z-index: 2; flex-wrap: wrap;
        }
        .social-item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .social-item a { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .social-box {
            width: 68px; height: 68px;
            border: 1px solid rgba(255,255,255,.1);
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            transition: border-color var(--t) var(--ease), background var(--t) var(--ease);
        }
        .social-item:hover .social-box {
            border-color: var(--accent);
            background: rgba(13,63,168,.16);
        }
        .social-box svg {
            width: 28px; height: 28px;
            fill: rgba(255,255,255,.5);
            transition: fill var(--t) var(--ease);
        }
        .social-item:hover .social-box svg { fill: #fff; }
        .social-label {
            font-family: 'Oswald', sans-serif; font-size: .6em; font-weight: 300;
            letter-spacing: .3em; color: var(--ink-light);
            text-transform: uppercase; transition: color var(--t);
        }
        .social-item:hover .social-label { color: rgba(255,255,255,.65); }

        /* ── BLUEARK STRIP ── */
        .blueark-strip {
            margin-top: 72px; padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,.05);
            position: relative; z-index: 2;
        }
        .blueark-strip-inner {
            display: inline-flex; align-items: center; gap: 16px;
            padding: 20px 32px;
            border: 1px solid rgba(255,255,255,.08); border-radius: 6px;
            transition: border-color var(--t);
        }
        .blueark-strip-inner:hover { border-color: rgba(13,63,168,.5); }
        .blueark-logo-icon {
            width: 44px; height: 44px; flex-shrink: 0;
            background: var(--accent); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .blueark-logo-icon svg { width: 26px; height: 26px; }
        .blueark-strip-text { text-align: right; }
        .blueark-strip-name {
            display: block; font-family: 'Oswald', sans-serif; font-weight: 700;
            font-size: .95em; color: #fff; letter-spacing: .06em;
        }
        .blueark-strip-sub {
            font-family: 'Cairo', sans-serif; font-size: .78em; color: var(--ink-light);
        }

        .footer-bar.dark-footer {
            border-top-color: rgba(255,255,255,.05);
            color: rgba(255,255,255,.14);
            background: transparent;
        }

        @media (max-width: 520px) { .socials { gap: 22px; } }
